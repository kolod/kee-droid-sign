name: Sign sample APK

# Builds the android/ test fixture and signs it with the key that KeeDroidSign exported into the
# "release" environment. The environment allows only branch main and tags v*, so a workflow pushed
# to any other branch cannot read the signing secrets.
# Contracts: specs/002-android-signing-e2e/contracts/workflow.md, specs/005-environment-secrets/contracts/plugin-ui.md
run-name: Sign sample APK ${{ inputs.request_id || github.sha }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Caller-supplied identifier echoed in the run name and signing report"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-sign.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-sign.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  # Pull requests (including forks) have no access to secrets: build the debug APK only.
  build-debug:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Matches android/gradle/gradle-daemon-jvm.properties (JDK 21).
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # A green pull-request run must not be mistaken for a verified signing run (FR-008).
      - name: Explain skipped signing
        run: |
          msg="Signing skipped: pull requests have no access to the signing secrets (environment release). Only the debug APK was built; run the workflow manually on main to sign."
          echo "::notice title=Signing skipped::$msg"
          echo "### Signing skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  sign:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The signing secrets are environment secrets: only jobs that declare the environment, and run
    # from a ref its deployment policy allows (main, v*), can read them.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name in environment release"
              missing=1
            fi
          done
          exit "$missing"

      # Consumer contract for the exported secrets (same files as the reference project
      # kolod/whiskergrid). Secrets are passed through env: rather than expanded into the script,
      # so no secret value can ever be interpreted as shell code.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/release.keystore.jks

      - name: Write keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # .properties treats '\' as an escape character and drops leading spaces of a value,
          # so backslashes are doubled and a leading space is escaped.
          esc() {
            local v="${1//\\/\\\\}"
            if [ "${v:0:1}" = " " ]; then v="\\$v"; fi
            printf '%s' "$v"
          }
          {
            echo "storeFile=release.keystore.jks"
            echo "storePassword=$(esc "$STORE_PASSWORD")"
            echo "keyAlias=$(esc "$KEY_ALIAS")"
            echo "keyPassword=$(esc "$KEY_PASSWORD")"
          } > app/keystore.properties

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease -PappVersionCode=${{ github.run_number }} --stacktrace

      - name: Verify signature
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          COMMIT: ${{ github.sha }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          apk=app/build/outputs/apk/release/app-release.apk
          echo "apksigner $("$apksigner" version)"
          "$apksigner" verify --verbose --print-certs "$apk" > apksigner.txt
          # Certificates are public data; keep the raw output for diagnosis.
          cat apksigner.txt

          # Signer labels differ between build-tools versions ("Signer #1 ..." or
          # "Signer (minSdkVersion=..., maxSdkVersion=...) ..."), so count distinct certificates.
          digests=$(grep -E 'certificate SHA-256 digest: [0-9a-fA-F]{64}$' apksigner.txt \
            | awk '{print tolower($NF)}' | sort -u)
          signers=$(printf '%s' "$digests" | grep -c . || true)
          if [ "$signers" -ne 1 ]; then
            echo "::error::Expected exactly one signing certificate, found $signers"
            exit 1
          fi

          sha256=$(printf '%s' "$digests" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          if [ "${#sha256}" -ne 95 ]; then
            echo "::error::Could not read the SHA-256 certificate digest"
            exit 1
          fi

          cp "$apk" keedroidsign-sample.apk
          jq -n --arg request_id "$REQUEST_ID" --arg commit "$COMMIT" --arg sha256 "$sha256" \
            --argjson signer_count "$signers" \
            '{request_id: $request_id, commit: $commit, apk: "keedroidsign-sample.apk", signer_count: $signer_count, sha256: $sha256}' \
            > signing-report.json

          {
            echo "### Signed sample APK"
            echo
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Request ID | \`${REQUEST_ID:-n/a}\` |"
            echo "| Commit | \`$COMMIT\` |"
            echo "| Signers | $signers |"
            echo "| SHA-256 | \`$sha256\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sample-apk
          path: android/keedroidsign-sample.apk
          if-no-files-found: error

      - name: Upload signing report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-report
          path: android/signing-report.json
          if-no-files-found: error

      - name: Clean up signing files
        if: always()
        run: rm -f app/release.keystore.jks app/keystore.properties
