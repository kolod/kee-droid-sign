name: Sign sample APK

# Builds the android/ test fixture and signs it with the key stored in the repository secrets
# exported by KeeDroidSign. Contract: specs/002-android-signing-e2e/contracts/workflow.md
run-name: Sign sample APK ${{ inputs.request_id || github.sha }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Caller-supplied identifier echoed in the run name and signing report"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-sign.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-sign.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  # Pull requests (including forks) have no access to secrets: build the debug APK only.
  build-debug:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # Matches android/gradle/gradle-daemon-jvm.properties (JDK 21).
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

  sign:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name"
              missing=1
            fi
          done
          exit "$missing"

      # The next two steps are intentionally identical to the reference project
      # (kolod/whiskergrid release.yml): they are the consumer contract for the exported secrets.
      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore.jks

      - name: Write keystore.properties
        run: |
          cat > app/keystore.properties <<EOF
          storeFile=release.keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease -PappVersionCode=${{ github.run_number }} --stacktrace

      - name: Verify signature
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          COMMIT: ${{ github.sha }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          apk=app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --print-certs "$apk" > apksigner.txt

          signers=$(grep -c '^Signer #[0-9]* certificate DN:' apksigner.txt || true)
          if [ "$signers" -ne 1 ]; then
            echo "::error::Expected exactly one signer, found $signers"
            exit 1
          fi

          sha256=$(grep -m1 '^Signer #1 certificate SHA-256 digest:' apksigner.txt \
            | awk '{print $NF}' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          if [ "${#sha256}" -ne 95 ]; then
            echo "::error::Could not read the SHA-256 certificate digest"
            exit 1
          fi

          cp "$apk" keedroidsign-sample.apk
          jq -n --arg request_id "$REQUEST_ID" --arg commit "$COMMIT" --arg sha256 "$sha256" \
            --argjson signer_count "$signers" \
            '{request_id: $request_id, commit: $commit, apk: "keedroidsign-sample.apk", signer_count: $signer_count, sha256: $sha256}' \
            > signing-report.json

          {
            echo "### Signed sample APK"
            echo
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Request ID | \`${REQUEST_ID:-n/a}\` |"
            echo "| Commit | \`$COMMIT\` |"
            echo "| Signers | $signers |"
            echo "| SHA-256 | \`$sha256\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: sample-apk
          path: android/keedroidsign-sample.apk
          if-no-files-found: error

      - name: Upload signing report
        uses: actions/upload-artifact@v7
        with:
          name: signing-report
          path: android/signing-report.json
          if-no-files-found: error

      - name: Clean up signing files
        if: always()
        run: rm -f app/release.keystore.jks app/keystore.properties
